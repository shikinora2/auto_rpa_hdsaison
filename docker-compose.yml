name: hdsaison-rpa

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hdsaison-rpa
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: "false"
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
      CLEANUP_ENABLED: "${CLEANUP_ENABLED:-true}"
    volumes:
      - ./app_data:/app/app_data
      - ./downloads_contracts:/app/downloads_contracts
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
